<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build New Template Structure</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="window">
    <div class="title-bar">Build New Template Structure</div>

    <div class="content">
      <h2>Define Template Structure</h2>

      <label for="templateName">Template Name</label>
      <input type="text" id="templateName" placeholder="e.g, Python CLI Project">

      <div class="main-section">
        <div class="folder-structure">
          <h3>Folder Structure</h3>
          <div class="tree-actions">
            <button id="addTemplateFolderBtn">+ Template</button>
            <button id="addFolderBtn">+ Folder</button>
            <button id="addFileBtn">+ File</button>
            <button id="deleteBtn">🗑 Delete</button>
          </div>

          <!-- The tree container -->
          <ul id="templateTree" class="tree-root">
            <li class="folder" data-type="folder">
              <span class="tree-item-content selected">
                <span class="icon">📁</span>
                <input type="text" value="Template Root" readonly>
              </span>
              <ul class="sub-tree"></ul>
            </li>
          </ul>
        </div>

        <div class="file-content">
          <h3>File Content (README.md)</h3>
          <textarea id="fileContent" rows="12">
# ⟪ProjectName⟫

This is a template for a new CLI project.
          </textarea>
        </div>
      </div>

      <div class="template-options">
        <label><input type="checkbox" id="includeEmpty" checked> Include Empty Folders</label><br>
        <label><input type="checkbox" id="enablePlaceholders" checked> Enable Variable Placeholders</label>
      </div>

      <div class="buttons">
        <button class="cancel">Cancel</button>
        <button id="saveTemplateBtn" class="save">Save Template</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
