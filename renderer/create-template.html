<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>templ.it - create</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./css/create-template.css" />
    <script defer type="module" src="../renderer.js"></script>
  </head>
  <body>
    <main>
      <div id="title-bar">
        <div id="title">templ.it</div>
        <div id="window-controls">
          <button id="min-btn" title="Minimize">─</button>
          <button id="max-btn" title="Maximize">□</button>
          <button id="close-btn" title="Close">✕</button>
        </div>
      </div>

      <div class="container">
        <div class="input-group">
          <label class="input-label template-path-label" for="template-label"
            >Template Name:</label
          >
          <small class="helper-text"
            ><i>// Enter a name for your templ.it()</i></small
          >
          <div class="">
            <input
              type="text"
              name="template-name"
              id="template-name"
              placeholder="e.g, Python CLI Project"
              class="input-template-name" />
          </div>
        </div>

        <div class="input-group input-destination">
          <label for="template-location" class="input-label"
            >Select Location:</label
          >
          <small class="helper-text folder-location"
            ><i>// Enter a location for your templ.it()</i></small
          >
          <div class="input-with-button input-destination-style">
            <input
              type="text"
              id="template-location"
              placeholder="~/Templates/..."
              readonly
              class="input-destination-path" />
            <button
              id="template-location-btn"
              class="btn-icon"
              title="Select location folder">
              📁
            </button>
          </div>
        </div>

        <div class="main-section">
          <div class="file-structure">
            <label for="file-content" class="input-label"
              >Template Structure:</label
            >
            <small class="helper-text"
              ><i>// Your templ.it() folder structure...</i></small
            >
            <div id="folder-structure-content" name="file-content" rows="12">
              # ⟪ProjectName⟫ This is a template for a new CLI project.
            </div>
          </div>
          <div class="buttons">
            <button id="cancel-template-btn" class="action-btn cancel">
              &gt;: Cancel
            </button>
            <button id="save-template-btn" class="action-btn save">
              &gt;: Save Template
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
