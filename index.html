<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./renderer/css/index.css" />
    <title>templ.it - main</title>
    <script defer type="module" src="./renderer.js"></script>
  </head>

  <body>
    <main class="wrapper">
      <div id="title-bar">
        <div id="title">
          <span class="ronin-yellow">templ</span>.<span class="oni-violet"
            >it</span
          ><span class="bright-cyan">();</span>
        </div>
        <div id="window-controls">
          <button id="max-btn" title="Maximize">
            <img
              src="./renderer/assets/icons/maximize.svg"
              alt="maximize icon"
            />
          </button>
          <button id="min-btn" title="Minimize">
            <img
              src="./renderer/assets/icons/minimize.svg"
              alt="minimize icon"
            />
          </button>
          <button id="close-btn" title="Close">
            <img src="./renderer/assets/icons/close.svg" alt="close icon" />
          </button>
        </div>
      </div>

      <div class="container">
        <div class="input-group">
          <label class="input-label template-path-label" for="template-path"
            >Select Template:</label
          >
          <small class="helper-text"
            ><i>// List of available templates</i></small
          >
          <div class="input-with-button input-template">
            <input
              type="options"
              id="template-select"
              placeholder="Select a template or ... "
              name="template-select"
              list="template-list"
              class="input-template-select"
            />
            <datalist id="template-list" class="input-template-list">
            </datalist>
            <button
              id="create-template-btn"
              class="action-btn"
              title="Create a new template"
            >
              &gt;: Create Template;
            </button>
          </div>
          <div class="input-group input-group-sub">
            <small class="helper-text"
              ><i>// Enter a name for your templ.it()</i></small
            >
            <div class="input-group-text">
              <input
                type="text"
                name="template-name"
                id="template-instance-name"
                placeholder="e.g. COMP1510 Folder Structure, Work Project Setup, ..."
                class="input-template-instance-name"
              />
            </div>
          </div>
        </div>

        <div class="input-group input-destination">
          <label for="destination-path" class="input-label">Destination:</label>
          <div class="input-with-button input-destination-style">
            <input
              type="text"
              id="destination-path"
              placeholder="~/Templates/..."
              readonly
              class="input-destination-path"
            />
            <button
              id="select-destination-btn"
              class="btn-icon"
              title="Select destination folder"
            >
              📁
            </button>
          </div>
          <small class="helper-text">
            <i
              >// Template will be copied to
              <span id="template-destination" class="save-to"
                >"~/Templates/..."</span
              ></i
            >
          </small>
          <button
            id="copy-template-btn"
            class="action-btn"
            title="Copy template to destination"
          >
            &gt;: Copy Template
          </button>
        </div>

        <div id="status-log" class="update-log">
          <p class="log-message">
            &gt;
            <span id="status-message-normal" class="status-message normal"
              >... waiting for user input</span
            >
          </p>
          <p class="log-message">
            &gt;
            <span id="status-message-success" class="status-message success"
              >templ.it successfully loaded.</span
            >
          </p>

          <p class="log-message">
            &gt;
            <span id="status-message-pending" class="status-message pending"
              >... templ.it loading</span
            >
          </p>
          <p class="log-message" id="preview-log" hidden>
            &gt; Loading template preview... <br />
            <span id="preview-name"></span> <br />
            <span id="template-preview"></span>
          </p>
          <p class="log-message" id="success-message" hidden></p>
        </div>
      </div>
    </main>
  </body>
</html>
