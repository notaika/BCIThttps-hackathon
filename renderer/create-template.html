<!DOCTYPE html>
<html lang="en">
  <head>
    <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'" />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./css/create-template.css" />
    <title>templ.it - create</title>
  </head>
  <body>
    <main class="wrapper">
      <div id="title-bar">
        <div id="title">
          <span class="ronin-yellow">templ</span>.<span class="oni-violet"
            >it</span
          ><span class="bright-cyan">();</span>
        </div>
        <div id="window-controls">
          <button id="max-btn" title="Maximize">
            <img src="./assets/icons/maximize.svg" alt="maximize icon" />
          </button>
          <button id="min-btn" title="Minimize">
            <img src="./assets/icons/minimize.svg" alt="minimize icon" />
          </button>
          <button id="close-btn" title="Close">
            <img src="./assets/icons/close.svg" alt="close icon" />
          </button>
        </div>
      </div>

      <div class="container">
        <div class="input-group">
          <label class="input-label template-path-label" for="template-label"
            >New Template Name</label
          >
          <small class="helper-text"
            ><i>// Enter a name for your new template</i></small
          >
          <div class="input-group-text">
            <input
              type="text"
              name="template-name"
              id="template-name"
              placeholder="e.g, Python CLI Project"
              class="input-template-name" />
          </div>
        </div>

        <div class="input-group input-destination">
          <label for="template-location" class="input-label"
            >Select New Template Structure</label
          >
          <small class="helper-text folder-location"
            ><i>// Select a folder structure to convert into a template</i></small
          >
          <div class="input-with-button input-destination-style">
            <input
              type="text"
              id="template-location"
              placeholder="~/User/Templates/New-Template..."
              readonly
              class="input-destination-path" />
            <button
              id="template-location-btn"
              class="btn-icon"
              title="Select location folder">
              📁
            </button>
          </div>
        </div>

        <div class="main-section">
          <div class="file-structure">
            <label for="file-content" class="input-label"
              >Current Template Structure</label
            >
            <small class="helper-text"
              ><i>// Your template structure currently looks like...</i></small
            >
            <div id="folder-structure-content" name="file-content">
              <i>e.g., # ⟪ProjectName⟫ This is a template for a new CLI project.</i>
            </div>
          </div>
          <div class="buttons">
            <button id="cancel-template-btn" class="action-btn cancel">
              &gt;: Cancel
            </button>
            <button id="save-template-btn" class="action-btn save">
              &gt;: Save Template
            </button>
          </div>
        </div>
      </div>
      <script type="module" src="./js/new-template-renderer.js"></script>
    </main>
  </body>
</html>
