<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'" />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="./style.css" />
    <title>templ.it</title>
  </head>

  
  
  <body>
<div id="title-bar">
  <div id="title">templ.it</div>
  <div id="window-controls">
    <button id="min-btn" title="Minimize">─</button>
    <button id="max-btn" title="Maximize">□</button>
    <button id="close-btn" title="Close">✕</button>
  </div>
</div>


<div class="container">
  <div class="input-group">
    <label for="template-path">Template</label>
    <div class="input-with-button">
      <input
        type="options"
        id="template-select"
        placeholder="Select a template"
        name="template-select" 
        list="template-list"/>
      <datalist id="template-list">
        <option value="Template 1"></option>
        <option value="Template 2"></option>
        <option value="Template 3"></option>
      </datalist>
          <button id="create-template-btn" class="action-btn">
      >: create a new template
    </button>
    </div>
    <small class="helper-text">List of available templates or custom folder.</small>
  </div>

  <div class="input-group">
    <label for="destination-path">Destination:</label>
    <div class="input-with-button">
      <input
        type="text"
        id="destination-path"
        placeholder="~/Templates/..."
        readonly />
      <button
        id="select-destination-btn"
        class="btn-icon"
        title="Select destination folder">
        📁 
      </button>
    </div>
    <small class="helper-text">
      Template will be copied to <span id="template-destination">~/Templates/...</span>
    </small>
  </div>

  <div class="action-buttons">
    <button id="copy-template-btn" class="action-btn">>: copy template</button>

  </div>

  <div id="status-log" class="update-log">
    <p id="status-message">> ... Ready</p>
  </div>
  </body>
</html>


</div>
